<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sinha IT | ডিজিটাল সার্ভিস</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Noto Sans Bengali", Arial, sans-serif;
}

:root{
    --bg:#ffffff;
    --text:#222;
    --primary:#0066ff;
    --card:#f5f7fb;
}

body{
    background:var(--bg);
    color:var(--text);
    transition:.3s;
}

.dark{
    --bg:#111827;
    --text:#ffffff;
    --card:#1f2937;
}

header{
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--bg);
    position:sticky;
    top:0;
    box-shadow:0 2px 10px #0002;
    z-index:10;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:var(--primary);
}

button{
    cursor:pointer;
    border:none;
    padding:12px 20px;
    border-radius:30px;
}

.mode{
    background:var(--primary);
    color:white;
}

.hero{
    padding:80px 8%;
    text-align:center;
    animation:fade 1s;
}

.hero h1{
    font-size:45px;
}

.hero span{
    color:var(--primary);
}

.hero p{
    margin:20px;
    font-size:18px;
}

.btn{
    background:#25D366;
    color:white;
    text-decoration:none;
    padding:14px 25px;
    border-radius:30px;
    display:inline-block;
    margin:10px;
}

.call{
    background:var(--primary);
}

section{
    padding:60px 8%;
}

.title{
    text-align:center;
    margin-bottom:40px;
    font-size:32px;
}

.services{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:var(--card);
    padding:30px;
    border-radius:20px;
    text-align:center;
    transition:.3s;
}

.card:hover{
    transform:translateY(-10px);
}

.card h3{
    color:var(--primary);
    margin-bottom:15px;
}

.contact{
    max-width:600px;
    margin:auto;
}

input, textarea{
    width:100%;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ccc;
}

.submit{
    background:var(--primary);
    color:white;
    width:100%;
}

footer{
    background:#000;
    color:white;
    text-align:center;
    padding:25px;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:600px){
    .hero h1{
        font-size:32px;
    }
}
</style>

</head>

<body>

<p>
বিকাশ পেমেন্ট ও ডিজিটাল লেনদেন সুবিধা।
</p>
</div>


<div class="card">
<h3>💰 নগদ সার্ভিস</h3>
<p>

</div>


<div class="card">
<h3>📱 মোবাইল ব্যাংকিং</h3>
<p>

</div>

</div>

</section>


<section>

}

</body>
</html>
